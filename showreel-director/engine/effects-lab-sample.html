<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Effects lab</title>
<style>

:root{--bg:#151515;--panel:#202020;--fg:#f2f2f2;--mute:#9a9a9a;--line:#333;--acc:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#101010ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:15px;margin:0 8px 0 0}label{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px}
input[type=text]{background:#000;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:190px}
input[type=color]{width:28px;height:24px;border:0;padding:0;background:none}
button{background:#2b2b2b;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button.on{background:var(--acc);color:#111;border-color:var(--acc)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:6px 16px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
.meta{padding:8px 10px;display:flex;gap:8px;align-items:flex-start}.meta b{display:block}.meta small{color:var(--mute);display:block;margin-top:2px}
.tag{font-size:10px;border:1px solid var(--line);border-radius:10px;padding:1px 6px;color:var(--mute);white-space:nowrap}
.heart{font-size:16px;line-height:1;padding:4px 8px}.heart.on{background:var(--acc);color:#111}
.gifb{font-size:11px;padding:4px 7px;margin-left:auto}
h2{margin:18px 16px 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#guide{padding:6px 16px}#guide h3{margin:10px 0 2px;font-size:16px}#guide p{color:var(--mute);margin:2px 0 12px}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}.tile.on{border-color:var(--acc)}
.tile canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}.tile .meta b{font-size:15px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.bar .chip{border:1px solid var(--line);border-radius:12px;padding:3px 10px;color:var(--mute)}
button.go{background:var(--acc);color:#111;border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
footer{position:fixed;left:0;right:0;bottom:0;background:#101010f2;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center}
#picks{flex:1;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<header><h1>Effects lab</h1>
<label>Sample text <input type="text" id="txt" value="Simple. Fast. Yours." maxlength="28"></label>
<label>Background<input type="color" id="c1"></label><label>Text<input type="color" id="c2"></label><label>Accent<input type="color" id="c3"></label><label>Accent 2<input type="color" id="c4"></label>
<label>Search <input type="text" id="q" placeholder="name or idea" style="width:130px"></label><label>Speed <input type="range" id="spd" min="0.4" max="2" step="0.1" value="1"></label><button id="pause">Pause</button></header>
<div id="guide"></div><nav id="nav"></nav><div id="grid"></div>
<footer><span id="count" style="color:var(--mute);font-size:12px"></span><button id="copy">Copy my picks</button><span id="picks">Click ♥ on the effects you like, then copy your picks and paste them in the chat.</span></footer>
<script>
const PAL={"bg": "#151515", "fg": "#f2f2f2", "accent": "#ffd166", "accent2": "#6c8cff", "mute": "#8a8a8a"}; const FONT="system-ui,sans-serif"; const PACKS=[{"name": "Deadpan", "feel": "Calm, precise, comic by contrast", "effects": ["Fade", "Rise", "Stamp", "Wind exit", "Scale one word", "Flash cut"]}, {"name": "Kinetic punch", "feel": "Loud, beat-driven", "effects": ["Slam", "Zoom punch", "Letter stagger", "Shake", "Whip pan", "Particle burst"]}, {"name": "Clean product", "feel": "Corporate, clear, reassuring", "effects": ["Mask wipe", "Line mask rise", "Push", "Count-up", "Underline draw", "Fade to logo"]}, {"name": "Playful toy", "feel": "Bouncy, colourful", "effects": ["Pop", "Elastic", "Bounce", "Squash and stretch", "Domino", "Confetti cannon"]}, {"name": "Cinematic", "feel": "Slow, dramatic", "effects": ["Blur in", "Slow push-in", "Spotlight", "Silence then hit", "Curtain"]}, {"name": "Tech decode", "feel": "Digital, fast", "effects": ["Scramble decode", "Slot roll", "Hard wipe", "Grid reflow", "Marquee"]}]; const GUIDED=true; const PRESEL=[];
const GT={title:'Pick the feel first',hint:'Choose one or two moods. You will then see only their effects, not all of them.',show:'Show these effects',all:'Browse every effect',change:'Change mood',packs:'Mood',back:'Back to the moods',tiles:'effects'};
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const e={lin:t=>t,out2:t=>1-(1-t)*(1-t),in2:t=>t*t,io2:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out4:t=>1-Math.pow(1-t,4),io4:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,in4:t=>t*t*t*t,out3:t=>1-Math.pow(1-t,3),in3:t=>t*t*t,io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,expo:t=>t>=1?1:1-Math.pow(2,-10*t),
 back:t=>{const c=1.70158,d=c+1;return 1+d*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
 elastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1,
 bounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}};
const W=640,H=360;
const hs=(a,b=0)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
function setFont(g,s,w=800){g.font=`${w} ${Math.round(s)}px ${FONT}`}
function T(g,s,x,y,size,col,o={}){g.save();setFont(g,size,o.w||800);g.fillStyle=col;g.textAlign=o.al||'center';g.textBaseline='middle';g.globalAlpha*=o.a==null?1:o.a;
 g.translate(x,y);if(o.rot)g.rotate(o.rot);g.scale(o.sx==null?(o.s==null?1:o.s):o.sx,o.sy==null?(o.s==null?1:o.s):o.sy);g.fillText(s,0,0);g.restore()}
function widths(g,s,size){g.save();setFont(g,size);const w=[...s].map(c=>g.measureText(c).width);g.restore();return w}
function letters(g,s,x,y,size,col,cb){const ch=[...s],w=widths(g,s,size),tot=w.reduce((a,b)=>a+b,0);let cx=x-tot/2;
 ch.forEach((c,i)=>{const o=cb(i,ch.length,c)||{};if(c!==' '&&(o.a==null||o.a>.003))T(g,c,cx+w[i]/2+(o.dx||0),y+(o.dy||0),size,o.col||col,{a:o.a,s:o.s,rot:o.rot,sx:o.sx,sy:o.sy});cx+=w[i]})}
function bg(g,c){g.fillStyle=c.P.bg;g.fillRect(0,0,W,H)}
function sceneA(g,c){g.fillStyle=c.P.bg;g.fillRect(0,0,W,H);g.fillStyle=c.P.accent;g.beginPath();g.arc(W/2,H/2,70,0,7);g.fill();T(g,'A',W/2,H/2,64,c.P.bg)}
function sceneB(g,c){g.fillStyle=c.P.fg;g.fillRect(0,0,W,H);g.fillStyle=c.P.accent2;g.fillRect(W/2-70,H/2-70,140,140);T(g,'B',W/2,H/2,64,c.P.bg)}
function hex(c){return[1,3,5].map(i=>parseInt(c.slice(i,i+2),16))}
function lerpCol(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`}

const _lay={};function layer(id){let c=_lay[id];if(!c){c=document.createElement('canvas');c.width=W;c.height=H;_lay[id]=c}const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;x.clearRect(0,0,W,H);return[c,x]}
function pixelate(g,res,cb){const[c,x]=layer('px');cb(x);g.save();g.imageSmoothingEnabled=false;const s=Math.max(1,res),sw=W/s,sh=H/s,[c2,x2]=layer('px2');x2.imageSmoothingEnabled=false;x2.drawImage(c,0,0,W,H,0,0,sw,sh);g.drawImage(c2,0,0,sw,sh,0,0,W,H);g.restore()}
const ease2=(p,a,b)=>clamp((p-a)/(b-a));
function star(g,x,y,r,n=4,col){g.save();g.translate(x,y);g.fillStyle=col;g.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rr=i%2?r*.3:r;i?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();g.restore()}
function arrow(g,x1,y1,x2,y2,k,col,w=5){g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.lineCap='round';const x=lerp(x1,x2,k),y=lerp(y1,y2,k);g.beginPath();g.moveTo(x1,y1);g.lineTo(x,y);g.stroke();if(k>.95){const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-18*Math.cos(a-.5),y2-18*Math.sin(a-.5));g.lineTo(x2-18*Math.cos(a+.5),y2-18*Math.sin(a+.5));g.fill()}g.restore()}
const E=[];function fx(cat,name,desc,energy,dur,draw){E.push({cat,name,desc,energy,dur,draw})}
const S1=c=>c.txt, SZ=44;
/* ---------- TEXT IN ---------- */
const C1='Text in';
fx(C1,'Fade','Opacity rises, nothing else moves.','low',1.2,(g,p,c)=>{bg(g,c);T(g,S1(c),W/2,H/2,SZ,c.P.fg,{a:e.io3(p)})});
fx(C1,'Rise','Slides up a few pixels while fading in.','low',1.2,(g,p,c)=>{bg(g,c);const k=e.out3(p);T(g,S1(c),W/2,H/2+(1-k)*26,SZ,c.P.fg,{a:k})});
fx(C1,'Fly in','Slides in from the side with easing.','mid',1.1,(g,p,c)=>{bg(g,c);const k=e.expo(p);T(g,S1(c),W/2-(1-k)*W*.7,H/2,SZ,c.P.fg)});
fx(C1,'Drop','Falls from above with a small settle.','mid',1.3,(g,p,c)=>{bg(g,c);const k=e.bounce(p);T(g,S1(c),W/2,H/2-(1-k)*H*.8,SZ,c.P.fg,{a:clamp(p*6)})});
fx(C1,'Pop','Scales up from nothing with a slight overshoot.','mid',1,(g,p,c)=>{bg(g,c);const k=Math.max(0,e.back(p));T(g,S1(c),W/2,H/2,SZ,c.P.fg,{s:k,a:clamp(p*4)})});
fx(C1,'Zoom','Starts oversized and settles to size.','high',1,(g,p,c)=>{bg(g,c);const k=e.expo(p);T(g,S1(c),W/2,H/2,SZ,c.P.fg,{s:lerp(2.6,1,k),a:clamp(p*3)})});
fx(C1,'Slam','Lands oversized with a short shake.','high',1.1,(g,p,c)=>{bg(g,c);const k=e.expo(clamp(p/.35));const sh=p>.3?Math.sin(p*90)*8*Math.exp(-(p-.3)*9):0;T(g,S1(c),W/2+sh,H/2,SZ,c.P.accent,{s:lerp(3.4,1,k),a:clamp(p*8)})});
fx(C1,'Typewriter','Letters appear one by one with a caret.','mid',1.8,(g,p,c)=>{bg(g,c);const s=S1(c),n=Math.floor(s.length*clamp(p/.85));g.save();setFont(g,SZ);const wf=g.measureText(s).width,ws=g.measureText(s.slice(0,n)).width;g.restore();T(g,s.slice(0,n),W/2-wf/2,H/2,SZ,c.P.fg,{al:'left'});if(Math.floor(p*14)%2===0){g.fillStyle=c.P.accent;g.fillRect(W/2-wf/2+ws+4,H/2-SZ*.45,4,SZ*.9)}});
fx(C1,'Letter stagger','Each letter rises a beat after the previous one.','mid',1.5,(g,p,c)=>{bg(g,c);letters(g,S1(c),W/2,H/2,SZ,c.P.fg,(i,n)=>{const k=e.out3(clamp((p*1.5-i*.05)/.5));return{dy:(1-k)*30,a:k}})});
fx(C1,'Word stagger','Words arrive one after another.','mid',1.6,(g,p,c)=>{bg(g,c);const ws=S1(c).split(' ');ws.forEach((w,i)=>{const k=e.out3(clamp((p*1.6-i*.4)/.5));T(g,w,W/2,H/2+(i-(ws.length-1)/2)*SZ*1.1+(1-k)*20,SZ,i%2?c.P.accent:c.P.fg,{a:k})})});
fx(C1,'Mask wipe','A moving edge reveals the text.','low',1.3,(g,p,c)=>{bg(g,c);g.save();g.beginPath();g.rect(0,0,W*e.io3(p),H);g.clip();T(g,S1(c),W/2,H/2,SZ,c.P.fg);g.restore()});
fx(C1,'Scramble decode','Random glyphs resolve into the text.','mid',1.6,(g,p,c)=>{bg(g,c);const s=S1(c),G='#%&@$*+=?';const o=[...s].map((ch,i)=>ch===' '||p*1.3>i/s.length+.2?ch:G[Math.floor(hs(i,Math.floor(p*30))*G.length)]).join('');T(g,o,W/2,H/2,SZ,c.P.fg)});
fx(C1,'Blur in','From blurred to sharp.','low',1.3,(g,p,c)=>{bg(g,c);g.save();try{g.filter=`blur(${(1-e.out3(p))*14}px)`}catch(x){}T(g,S1(c),W/2,H/2,SZ,c.P.fg,{a:.2+.8*e.out3(p)});g.restore()});
fx(C1,'Elastic','Springs past its place and back.','mid',1.4,(g,p,c)=>{bg(g,c);T(g,S1(c),W/2,H/2,SZ,c.P.fg,{s:Math.max(0,e.elastic(p)),a:clamp(p*5)})});

/* ---------- TEXT OUT ---------- */
const C2='Text out';
fx(C2,'Fade out','Opacity falls away.','low',1.2,(g,p,c)=>{bg(g,c);T(g,S1(c),W/2,H/2,SZ,c.P.fg,{a:1-e.io3(clamp((p-.2)/.8))})});
fx(C2,'Wind exit','Letters are blown away left to right.','mid',1.5,(g,p,c)=>{bg(g,c);letters(g,S1(c),W/2,H/2,SZ,c.P.fg,(i,n)=>{const k=clamp((p*1.4-.2-i*.03)/.5);return{dx:e.in3(k)*W*.6,dy:-e.in3(k)*30,a:1-k,rot:k*1.2}})});
fx(C2,'Drop out','Falls off the bottom of the frame.','mid',1.2,(g,p,c)=>{bg(g,c);const k=e.in3(clamp((p-.25)/.75));T(g,S1(c),W/2,H/2+k*H,SZ,c.P.fg,{rot:k*.3})});
fx(C2,'Slide out','Leaves the way it came in.','mid',1.1,(g,p,c)=>{bg(g,c);const k=e.in3(clamp((p-.25)/.75));T(g,S1(c),W/2-k*W*.8,H/2,SZ,c.P.fg)});
fx(C2,'Shrink to corner','Becomes a small persistent title.','low',1.3,(g,p,c)=>{bg(g,c);const k=e.io3(clamp((p-.2)/.8));T(g,S1(c),lerp(W/2,28,k),lerp(H/2,28,k),lerp(SZ,18,k),c.P.fg,{al:k>.5?'left':'center'})});
fx(C2,'Strike and replace','Crossed out, then the new word lands.','mid',1.8,(g,p,c)=>{bg(g,c);const w=c.w1;g.save();setFont(g,SZ);const wd=g.measureText(w).width;g.restore();T(g,w,W/2,H/2-26,SZ,c.P.fg,{a:p<.6?1:.35});g.fillStyle=c.P.accent;g.fillRect(W/2-wd/2,H/2-26,wd*clamp(p/.3),5);const k=e.back(clamp((p-.55)/.4));T(g,c.w2,W/2,H/2+30,SZ,c.P.accent,{s:Math.max(0,k),a:clamp((p-.55)*6)})});
fx(C2,'Shatter','Breaks into pieces that fly apart.','high',1.3,(g,p,c)=>{bg(g,c);const k=e.in3(clamp((p-.25)/.75));letters(g,S1(c),W/2,H/2,SZ,c.P.fg,(i,n)=>({dx:(hs(i,1)-.5)*500*k,dy:(hs(i,2)-.3)*400*k,rot:(hs(i,3)-.5)*8*k,a:1-k}))});

/* ---------- EMPHASIS ---------- */
const C3='Emphasis';
fx(C3,'Pulse','Scale beats on the rhythm.','mid',1.6,(g,p,c)=>{bg(g,c);const k=1+.12*Math.pow(Math.max(0,Math.sin(p*Math.PI*6)),3);T(g,S1(c),W/2,H/2,SZ,c.P.fg,{s:k})});
fx(C3,'RGB split','Colour channels separate briefly.','high',1.2,(g,p,c)=>{bg(g,c);const k=Math.exp(-p*4)*14;g.save();g.globalCompositeOperation='screen';T(g,S1(c),W/2-k,H/2,SZ,'#ff2a2a');T(g,S1(c),W/2+k,H/2,SZ,'#2affff');T(g,S1(c),W/2,H/2,SZ,'#ffffff',{a:.9});g.restore()});
fx(C3,'Underline draw','A line draws itself under the text.','low',1.2,(g,p,c)=>{bg(g,c);T(g,S1(c),W/2,H/2-6,SZ,c.P.fg);g.save();setFont(g,SZ);const wd=g.measureText(S1(c)).width;g.restore();g.fillStyle=c.P.accent;g.fillRect(W/2-wd/2,H/2+SZ*.55,wd*e.io3(clamp(p/.7)),5)});
fx(C3,'Highlight swipe','A marker swipes behind the text.','low',1.3,(g,p,c)=>{bg(g,c);g.save();setFont(g,SZ);const wd=g.measureText(S1(c)).width;g.restore();g.fillStyle=c.P.accent;g.fillRect(W/2-wd/2-8,H/2-SZ*.55,(wd+16)*e.io3(clamp(p/.6)),SZ*1.1);T(g,S1(c),W/2,H/2,SZ,p>.3?c.P.bg:c.P.fg)});
fx(C3,'Outline to fill','Outline first, then the colour fills in.','low',1.4,(g,p,c)=>{bg(g,c);g.save();setFont(g,SZ);g.textAlign='center';g.textBaseline='middle';g.lineWidth=2;g.strokeStyle=c.P.fg;g.strokeText(S1(c),W/2,H/2);g.beginPath();g.rect(0,0,W*e.io3(clamp((p-.2)/.7)),H);g.clip();g.fillStyle=c.P.accent;g.fillText(S1(c),W/2,H/2);g.restore()});
fx(C3,'Shake','A short jitter after the hit.','high',1,(g,p,c)=>{bg(g,c);const k=Math.exp(-p*5);T(g,S1(c),W/2+Math.sin(p*120)*10*k,H/2+Math.cos(p*97)*6*k,SZ,c.P.fg)});
fx(C3,'Colour swap','The key word switches to the accent.','low',1.2,(g,p,c)=>{bg(g,c);letters(g,S1(c),W/2,H/2,SZ,c.P.fg,(i,n)=>({col:p>.4&&i>=n*.45?c.P.accent:c.P.fg}))});
fx(C3,'Scale one word','One word grows, the others stay small.','mid',1.5,(g,p,c)=>{bg(g,c);T(g,c.w1,W/2,H/2-50,SZ*.6,c.P.fg,{a:.7});T(g,c.w2,W/2,H/2+10,lerp(SZ,SZ*2.4,e.expo(clamp((p-.2)/.5))),c.P.accent)});
fx(C3,'Stamp','A rotated outlined stamp lands as an aside.','mid',1.2,(g,p,c)=>{bg(g,c);T(g,S1(c),W/2,H/2-20,SZ*.9,c.P.fg);const k=e.expo(clamp((p-.3)/.25));if(p>.3){g.save();g.translate(W/2+150,H/2+60);g.rotate(-.12);g.globalAlpha=clamp((p-.3)*8);const s=lerp(2.4,1,k);g.scale(s,s);g.strokeStyle=c.P.accent;g.lineWidth=4;g.strokeRect(-70,-24,140,48);setFont(g,22);g.fillStyle=c.P.accent;g.textAlign='center';g.textBaseline='middle';g.fillText('NOTED',0,0);g.restore()}});

/* ---------- NUMBERS ---------- */
const C4='Numbers & proof';
fx(C4,'Slot roll','Digits roll like a slot machine to the new value.','mid',1.8,(g,p,c)=>{bg(g,c);g.save();g.beginPath();g.rect(W/2-170,H/2-45,340,90);g.clip();const k=e.out3(clamp(p/.8));const dy=lerp(0,90,k);T(g,'95 min',W/2,H/2-dy,SZ*1.3,c.P.fg);T(g,'12 min',W/2,H/2+90-dy,SZ*1.3,c.P.accent);g.restore()});

 const key=ef.cat+' › '+ef.name;const d=document.createElement('div');d.className='card';d.innerHTML=`<canvas width="640" height="360"></canvas><div class="meta"><div><b>${ef.name}</b><small>${ef.desc}</small></div><span class="tag">${ef.energy}</span><button class="gifb" title="Save this effect as a looping GIF">GIF</button><button class="heart${state.picks.has(key)?' on':''}">♥</button></div>`;
 d.querySelector('.gifb').onclick=ev=>saveGif(ef,ev.target);
 d.querySelector('.heart').onclick=ev=>{state.picks.has(key)?state.picks.delete(key):state.picks.add(key);ev.target.classList.toggle('on');upd()};gr.appendChild(d);
 const cv=d.querySelector('canvas');cards.push({ef,cv,g:cv.getContext('2d'),vis:true});});
 if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(en=>{const c=cards.find(x=>x.cv===en.target);if(c)c.vis=en.isIntersecting}));cards.forEach(c=>io.observe(c.cv))}}
function upd(){const by={};state.picks.forEach(k=>{const[c,n]=k.split(' › ');(by[c]=by[c]||[]).push(n)});const s0=Object.entries(by).map(([c,n])=>c+': '+n.join(', ')).join(' | ');const s=s0&&state.packSel.size?'Moods: '+[...state.packSel].join(', ')+' | '+s0:s0;$('picks').textContent=s||'Click ♥ on the effects you like, then copy your picks and paste them in the chat.';return s}
$('copy').onclick=()=>{const s=upd();if(!state.picks.size)return;const fallback=()=>{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(x){}t.remove()};try{navigator.clipboard.writeText(s).catch(fallback)}catch(x){fallback()}$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy my picks',1200)};
function saveGif(ef,btn){if(!window.GifLab)return;btn.disabled=true;const old=btn.textContent;btn.textContent='…';
 setTimeout(()=>{try{const words=(state.txt.value||'Simple. Fast. Yours.').trim().split(/\s+/),ctxo={P:state.P,txt:state.txt.value||'Simple. Fast. Yours.',w1:words[0],w2:words[1]||words[0]};
  const fps=20,gw=480,gh=270,n=Math.round((ef.dur+.6)*fps),big=document.createElement('canvas');big.width=W;big.height=H;const bg_=big.getContext('2d');
  const sm=document.createElement('canvas');sm.width=gw;sm.height=gh;const sg=sm.getContext('2d');const frames=[];
  for(let i=0;i<n;i++){const p=clamp(i/fps/ef.dur);bg_.setTransform(1,0,0,1,0,0);bg_.clearRect(0,0,W,H);bg_.save();ef.draw(bg_,p,ctxo);bg_.restore();sg.drawImage(big,0,0,W,H,0,0,gw,gh);frames.push(GifLab.quantize(sg.getImageData(0,0,gw,gh).data))}
  const bytes=GifLab.encode(frames,gw,gh,Math.round(100/fps)),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'image/gif'}));a.download=ef.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.gif';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(x){window.__ERR__=(window.__ERR__||[]).concat('gif '+ef.name+': '+x.message)}
  btn.disabled=false;btn.textContent=old},30)}
let clock=0,lastT=performance.now();
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(!state.paused)clock+=dt*state.speed;
 const words=(state.txt.value||'Simple. Fast. Yours.').trim().split(/\s+/);const ctxo={P:state.P,txt:state.txt.value||'Simple. Fast. Yours.',w1:words[0],w2:words[1]||words[0]};
 tiles.concat(cards).forEach(c=>{if(!c.vis)return;const cyc=c.ef.dur+1,t=clock%cyc,p=clamp(t/c.ef.dur);c.g.save();c.g.clearRect(0,0,W,H);try{c.ef.draw(c.g,p,ctxo)}catch(x){window.__ERR__=(window.__ERR__||[]).concat(c.ef.name+': '+x.message)}c.g.restore()});
 requestAnimationFrame(loop)}
render();upd();requestAnimationFrame(loop);$('count').textContent=state.mode==='packs'?'':E.length+' effects';
window.__EFFECTS__=E;window.__DRAW__=(i,p,ctx)=>E[i].draw(ctx.g,p,ctx.c);
</script></body></html>
