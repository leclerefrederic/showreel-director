<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Effects lab</title>
<style>
__FONTS_CSS__
:root{--bg:#151515;--panel:#202020;--fg:#f2f2f2;--mute:#9a9a9a;--line:#333;--acc:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#101010ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:15px;margin:0 8px 0 0}label{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px}
input[type=text]{background:#000;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:190px}
input[type=color]{width:28px;height:24px;border:0;padding:0;background:none}
button{background:#2b2b2b;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button.on{background:var(--acc);color:#111;border-color:var(--acc)}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:6px 16px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
.meta{padding:8px 10px;display:flex;gap:8px;align-items:flex-start}.meta b{display:block}.meta small{color:var(--mute);display:block;margin-top:2px}
.tag{font-size:10px;border:1px solid var(--line);border-radius:10px;padding:1px 6px;color:var(--mute);white-space:nowrap}
.heart{font-size:16px;line-height:1;padding:4px 8px}.heart.on{background:var(--acc);color:#111}
.gifb{font-size:11px;padding:4px 7px;margin-left:auto}
h2{margin:18px 16px 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
footer{position:fixed;left:0;right:0;bottom:0;background:#101010f2;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center}
#picks{flex:1;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<header><h1>Effects lab</h1>
<label>Sample text <input type="text" id="txt" value="Simple. Fast. Yours." maxlength="28"></label>
<label>Background<input type="color" id="c1"></label><label>Text<input type="color" id="c2"></label><label>Accent<input type="color" id="c3"></label><label>Accent 2<input type="color" id="c4"></label>
<label>Search <input type="text" id="q" placeholder="name or idea" style="width:130px"></label><label>Speed <input type="range" id="spd" min="0.4" max="2" step="0.1" value="1"></label><button id="pause">Pause</button></header>
<nav id="nav"></nav><div id="grid"></div>
<footer><span id="count" style="color:var(--mute);font-size:12px"></span><button id="copy">Copy my picks</button><span id="picks">Click ♥ on the effects you like, then copy your picks and paste them in the chat.</span></footer>
<script>
const PAL=__PALETTE__; const FONT=__FONT__;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const e={lin:t=>t,out2:t=>1-(1-t)*(1-t),in2:t=>t*t,io2:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out4:t=>1-Math.pow(1-t,4),io4:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,in4:t=>t*t*t*t,out3:t=>1-Math.pow(1-t,3),in3:t=>t*t*t,io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,expo:t=>t>=1?1:1-Math.pow(2,-10*t),
 back:t=>{const c=1.70158,d=c+1;return 1+d*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
 elastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1,
 bounce:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}};
const W=640,H=360;
const hs=(a,b=0)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
function setFont(g,s,w=800){g.font=`${w} ${Math.round(s)}px ${FONT}`}
function T(g,s,x,y,size,col,o={}){g.save();setFont(g,size,o.w||800);g.fillStyle=col;g.textAlign=o.al||'center';g.textBaseline='middle';g.globalAlpha*=o.a==null?1:o.a;
 g.translate(x,y);if(o.rot)g.rotate(o.rot);g.scale(o.sx==null?(o.s==null?1:o.s):o.sx,o.sy==null?(o.s==null?1:o.s):o.sy);g.fillText(s,0,0);g.restore()}
function widths(g,s,size){g.save();setFont(g,size);const w=[...s].map(c=>g.measureText(c).width);g.restore();return w}
function letters(g,s,x,y,size,col,cb){const ch=[...s],w=widths(g,s,size),tot=w.reduce((a,b)=>a+b,0);let cx=x-tot/2;
 ch.forEach((c,i)=>{const o=cb(i,ch.length,c)||{};if(c!==' '&&(o.a==null||o.a>.003))T(g,c,cx+w[i]/2+(o.dx||0),y+(o.dy||0),size,o.col||col,{a:o.a,s:o.s,rot:o.rot,sx:o.sx,sy:o.sy});cx+=w[i]})}
function bg(g,c){g.fillStyle=c.P.bg;g.fillRect(0,0,W,H)}
function sceneA(g,c){g.fillStyle=c.P.bg;g.fillRect(0,0,W,H);g.fillStyle=c.P.accent;g.beginPath();g.arc(W/2,H/2,70,0,7);g.fill();T(g,'A',W/2,H/2,64,c.P.bg)}
function sceneB(g,c){g.fillStyle=c.P.fg;g.fillRect(0,0,W,H);g.fillStyle=c.P.accent2;g.fillRect(W/2-70,H/2-70,140,140);T(g,'B',W/2,H/2,64,c.P.bg)}
function hex(c){return[1,3,5].map(i=>parseInt(c.slice(i,i+2),16))}
function lerpCol(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`}

const _lay={};function layer(id){let c=_lay[id];if(!c){c=document.createElement('canvas');c.width=W;c.height=H;_lay[id]=c}const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;x.clearRect(0,0,W,H);return[c,x]}
function pixelate(g,res,cb){const[c,x]=layer('px');cb(x);g.save();g.imageSmoothingEnabled=false;const s=Math.max(1,res),sw=W/s,sh=H/s,[c2,x2]=layer('px2');x2.imageSmoothingEnabled=false;x2.drawImage(c,0,0,W,H,0,0,sw,sh);g.drawImage(c2,0,0,sw,sh,0,0,W,H);g.restore()}
const ease2=(p,a,b)=>clamp((p-a)/(b-a));
function star(g,x,y,r,n=4,col){g.save();g.translate(x,y);g.fillStyle=col;g.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2,rr=i%2?r*.3:r;i?g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):g.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();g.restore()}
function arrow(g,x1,y1,x2,y2,k,col,w=5){g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.lineCap='round';const x=lerp(x1,x2,k),y=lerp(y1,y2,k);g.beginPath();g.moveTo(x1,y1);g.lineTo(x,y);g.stroke();if(k>.95){const a=Math.atan2(y2-y1,x2-x1);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-18*Math.cos(a-.5),y2-18*Math.sin(a-.5));g.lineTo(x2-18*Math.cos(a+.5),y2-18*Math.sin(a+.5));g.fill()}g.restore()}
const E=[];function fx(cat,name,desc,energy,dur,draw){E.push({cat,name,desc,energy,dur,draw})}
const S1=c=>c.txt, SZ=44;
/*__EFFECTS__*/
/*__GIF__*/
/* ---------- UI ---------- */
const state={q:'',txt:$('txt'),speed:1,paused:false,picks:new Set(),cat:'All',P:Object.assign({},PAL)};
['c1','c2','c3','c4'].forEach((id,i)=>{const k=['bg','fg','accent','accent2'][i];$(id).value=PAL[k];$(id).oninput=ev=>{state.P[k]=ev.target.value}});
$('q').oninput=ev=>{state.q=ev.target.value.toLowerCase();render()};$('spd').oninput=ev=>state.speed=+ev.target.value;$('pause').onclick=()=>{state.paused=!state.paused;$('pause').classList.toggle('on',state.paused);$('pause').textContent=state.paused?'Resume':'Pause'};
const cats=['All',...new Set(E.map(x=>x.cat))];
cats.forEach(cn=>{const b=document.createElement('button');b.textContent=cn;b.className=cn==='All'?'on':'';b.onclick=()=>{state.cat=cn;[...$('nav').children].forEach(x=>x.classList.toggle('on',x===b));render()};$('nav').appendChild(b)});
let cards=[];
function render(){const gr=$('grid');gr.innerHTML='';cards=[];let last='';E.forEach(ef=>{if(state.cat!=='All'&&ef.cat!==state.cat)return;if(state.q&&!(ef.name+' '+ef.desc+' '+ef.cat).toLowerCase().includes(state.q))return;if(state.cat==='All'&&ef.cat!==last){const h=document.createElement('h2');h.textContent=ef.cat;h.style.gridColumn='1/-1';gr.appendChild(h);last=ef.cat}
 const key=ef.cat+' › '+ef.name;const d=document.createElement('div');d.className='card';d.innerHTML=`<canvas width="640" height="360"></canvas><div class="meta"><div><b>${ef.name}</b><small>${ef.desc}</small></div><span class="tag">${ef.energy}</span><button class="gifb" title="Save this effect as a looping GIF">GIF</button><button class="heart${state.picks.has(key)?' on':''}">♥</button></div>`;
 d.querySelector('.gifb').onclick=ev=>saveGif(ef,ev.target);
 d.querySelector('.heart').onclick=ev=>{state.picks.has(key)?state.picks.delete(key):state.picks.add(key);ev.target.classList.toggle('on');upd()};gr.appendChild(d);
 const cv=d.querySelector('canvas');cards.push({ef,cv,g:cv.getContext('2d'),vis:true});});
 if('IntersectionObserver'in window){const io=new IntersectionObserver(es=>es.forEach(en=>{const c=cards.find(x=>x.cv===en.target);if(c)c.vis=en.isIntersecting}));cards.forEach(c=>io.observe(c.cv))}}
function upd(){const by={};state.picks.forEach(k=>{const[c,n]=k.split(' › ');(by[c]=by[c]||[]).push(n)});const s=Object.entries(by).map(([c,n])=>c+': '+n.join(', ')).join(' | ');$('picks').textContent=s||'Click ♥ on the effects you like, then copy your picks and paste them in the chat.';return s}
$('copy').onclick=()=>{const s=upd();if(!state.picks.size)return;const fallback=()=>{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(x){}t.remove()};try{navigator.clipboard.writeText(s).catch(fallback)}catch(x){fallback()}$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy my picks',1200)};
function saveGif(ef,btn){if(!window.GifLab)return;btn.disabled=true;const old=btn.textContent;btn.textContent='…';
 setTimeout(()=>{try{const words=(state.txt.value||'Simple. Fast. Yours.').trim().split(/\s+/),ctxo={P:state.P,txt:state.txt.value||'Simple. Fast. Yours.',w1:words[0],w2:words[1]||words[0]};
  const fps=20,gw=480,gh=270,n=Math.round((ef.dur+.6)*fps),big=document.createElement('canvas');big.width=W;big.height=H;const bg_=big.getContext('2d');
  const sm=document.createElement('canvas');sm.width=gw;sm.height=gh;const sg=sm.getContext('2d');const frames=[];
  for(let i=0;i<n;i++){const p=clamp(i/fps/ef.dur);bg_.setTransform(1,0,0,1,0,0);bg_.clearRect(0,0,W,H);bg_.save();ef.draw(bg_,p,ctxo);bg_.restore();sg.drawImage(big,0,0,W,H,0,0,gw,gh);frames.push(GifLab.quantize(sg.getImageData(0,0,gw,gh).data))}
  const bytes=GifLab.encode(frames,gw,gh,Math.round(100/fps)),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'image/gif'}));a.download=ef.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.gif';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}catch(x){window.__ERR__=(window.__ERR__||[]).concat('gif '+ef.name+': '+x.message)}
  btn.disabled=false;btn.textContent=old},30)}
let clock=0,lastT=performance.now();
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(!state.paused)clock+=dt*state.speed;
 const words=(state.txt.value||'Simple. Fast. Yours.').trim().split(/\s+/);const ctxo={P:state.P,txt:state.txt.value||'Simple. Fast. Yours.',w1:words[0],w2:words[1]||words[0]};
 cards.forEach(c=>{if(!c.vis)return;const cyc=c.ef.dur+1,t=clock%cyc,p=clamp(t/c.ef.dur);c.g.save();c.g.clearRect(0,0,W,H);try{c.ef.draw(c.g,p,ctxo)}catch(x){window.__ERR__=(window.__ERR__||[]).concat(c.ef.name+': '+x.message)}c.g.restore()});
 requestAnimationFrame(loop)}
render();upd();requestAnimationFrame(loop);$('count').textContent=E.length+' effects';
window.__EFFECTS__=E;window.__DRAW__=(i,p,ctx)=>E[i].draw(ctx.g,p,ctx.c);
</script></body></html>
